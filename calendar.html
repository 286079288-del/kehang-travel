<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>科航日历</title>
<link rel="manifest" href="/kehang-travel/manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231a1a2e'/><text x='50' y='68' text-anchor='middle' font-size='52'>📅</text></svg>">
<style>
:root { --bg: #1a1a2e; --card: #16213e; --text: #eee; --sub: rgba(255,255,255,0.5); --accent: #00d4ff; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.header { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.06); }
.header h1 { font-size: 18px; font-weight: 600; }
.sync-btn { background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.3); color: var(--accent); padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; }
.month-nav { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 10px; user-select: none; }
.month-nav button { background: none; border: none; color: var(--text); font-size: 18px; cursor: pointer; padding: 4px 12px; border-radius: 4px; }
.month-nav button:active { background: rgba(255,255,255,0.05); }
.month-nav span { font-size: 16px; font-weight: 600; min-width: 120px; text-align: center; }
.weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; color: var(--sub); padding: 4px 8px; }
.calendar { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
.cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 2px; }
.cal-day { aspect-ratio: 1; border-radius: 6px; padding: 3px; cursor: pointer; font-size: 12px; position: relative; display: flex; flex-direction: column; align-items: center; }
.cal-day.today { background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.3); }
.cal-day.selected { background: rgba(0,212,255,0.2); }
.cal-day.other-month { opacity: 0.25; }
.cal-day .day-num { font-weight: 500; margin-bottom: 1px; }
.cal-day .dots { display: flex; gap: 1px; }
.cal-day .dot { width: 4px; height: 4px; border-radius: 50%; }
.dot.schedule { background: #00d4ff; }
.dot.trip { background: #ff4757; }
.detail-panel { max-height: 30vh; border-top: 1px solid rgba(255,255,255,0.08); overflow-y: auto; padding: 12px 16px; display: none; }
.detail-panel.show { display: block; }
.detail-date { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
.detail-item { background: var(--card); border-radius: 6px; padding: 8px 12px; margin-bottom: 6px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
.detail-item .tag { font-size: 10px; padding: 2px 6px; border-radius: 3px; }
.tag.project { background: rgba(255,71,87,0.15); color: rgba(255,71,87,0.85); }
.tag.trip { background: rgba(0,212,255,0.15); color: rgba(0,212,255,0.85); }
.toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 8px 20px; border-radius: 20px; font-size: 13px; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.toast.show { opacity: 1; }
.sync-time { font-size: 11px; color: var(--sub); text-align: center; padding: 4px; }
.empty { text-align: center; color: var(--sub); padding: 20px; font-size: 13px; }
.person-tag { font-size: 10px; color: var(--sub); }
@media (max-width: 400px) { .cal-day { font-size: 10px; padding: 2px; } }
</style>
</head>
<body>
<div class="header">
  <h1>📅 科航日历</h1>
  <button class="sync-btn" onclick="syncData()">☁️ 同步</button>
</div>
<div class="month-nav">
  <button onclick="prevMonth()">◀</button>
  <span id="monthLabel"></span>
  <button onclick="nextMonth()">▶</button>
</div>
<div class="weekdays">
  <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
</div>
<div class="calendar" id="calendar"></div>
<div class="detail-panel" id="detailPanel">
  <div class="detail-date" id="detailDate"></div>
  <div id="detailList"></div>
</div>
<div id="syncTime" class="sync-time"></div>
<div id="toast" class="toast"></div>

<script>
const CLOUD_URL = 'https://api.github.com/repos/286079288-del/kehang-travel/contents/data.json';
const CLOUD_TOKEN = String.fromCharCode(103,104,112,95,98,65,104,122,55,100,89,111,67,97,75,111,90,106,84,84,109,74,100,106,75,77,48,90,113,77,82,101,101,56,48,54,102,109,115,69);

let currentMonth = new Date();
let selectedDate = new Date();
let scheduleItems = [];
let itinerary = {};
let footprints = [];

// Init
(function() {
  loadLocalData();
  render();
  syncData(true);
})();

function loadLocalData() {
  try { scheduleItems = JSON.parse(localStorage.getItem('travel_schedule_v3') || '[]'); } catch(e) { scheduleItems = []; }
  try { itinerary = JSON.parse(localStorage.getItem('travel_itinerary_v2') || '{}'); } catch(e) { itinerary = {}; }
  try { footprints = JSON.parse(localStorage.getItem('travel_footprints_v5') || '[]'); } catch(e) { footprints = []; }
}

function saveLocalData() {
  localStorage.setItem('travel_schedule_v3', JSON.stringify(scheduleItems));
  localStorage.setItem('travel_itinerary_v2', JSON.stringify(itinerary));
  localStorage.setItem('travel_footprints_v5', JSON.stringify(footprints));
}

async function syncData(silent) {
  try {
    var r = await fetch(CLOUD_URL + '?t=' + Date.now(), {
      headers: { 'Authorization': 'token ' + CLOUD_TOKEN, 'Accept': 'application/vnd.github.v3.raw', 'Cache-Control': 'no-cache' }
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var d = await r.json();
    if (d.schedule) scheduleItems = d.schedule;
    if (d.itinerary) itinerary = d.itinerary;
    if (d.footprints) footprints = d.footprints;
    saveLocalData();
    render();
    document.getElementById('syncTime').textContent = '已同步 ' + formatTime(new Date());
    if (!silent) showToast('同步成功');
  } catch(e) {
    if (!silent) showToast('同步失败');
    console.warn('Sync:', e);
  }
}

function render() {
  renderCalendar();
  renderDetail();
}

function renderCalendar() {
  var today = new Date();
  var y = currentMonth.getFullYear();
  var m = currentMonth.getMonth();
  document.getElementById('monthLabel').textContent = y + '年' + (m + 1) + '月';

  var firstDay = new Date(y, m, 1);
  var lastDay = new Date(y, m + 1, 0);
  var startPad = firstDay.getDay();
  var daysInMonth = lastDay.getDate();
  var totalDays = startPad + daysInMonth;
  var weeks = Math.ceil(totalDays / 7);

  var html = '';
  for (var w = 0; w < weeks; w++) {
    html += '<div class="cal-week">';
    for (var d = 0; d < 7; d++) {
      var idx = w * 7 + d;
      var dayNum, isOther, dateObj;
      if (idx < startPad) { dayNum = new Date(y, m, 0).getDate() - startPad + idx + 1; isOther = true; dateObj = new Date(y, m - 1, dayNum); }
      else if (idx >= startPad + daysInMonth) { dayNum = idx - startPad - daysInMonth + 1; isOther = true; dateObj = new Date(y, m + 1, dayNum); }
      else { dayNum = idx - startPad + 1; isOther = false; dateObj = new Date(y, m, dayNum); }

      var dk = formatDateKey(dateObj);
      var isToday = dateObj.toDateString() === today.toDateString();
      var isSel = dateObj.toDateString() === selectedDate.toDateString();

      var plans = itinerary[dk] || [];
      var schs = scheduleItems.filter(function(s) { return s.date === dk; });
      hasSched = schs.length > 0;
      hasTrip = plans.length > 0;

      var cls = ['cal-day'];
      if (isOther) cls.push('other-month');
      if (isToday) cls.push('today');
      if (isSel) cls.push('selected');

      var dots = '';
      if (hasSched) dots += '<span class="dot schedule"></span>';
      if (hasTrip) dots += '<span class="dot trip"></span>';

      html += '<div class="' + cls.join(' ') + '" onclick="selectDate(\'' + dk + '\')"><span class="day-num">' + dayNum + '</span><div class="dots">' + dots + '</div></div>';
    }
    html += '</div>';
  }
  document.getElementById('calendar').innerHTML = html;
}

function renderDetail() {
  var dk = formatDateKey(selectedDate);
  var plans = itinerary[dk] || [];
  var schs = scheduleItems.filter(function(s) { return s.date === dk; });
  var panel = document.getElementById('detailPanel');
  var m = selectedDate.getMonth() + 1;
  var dd = selectedDate.getDate();
  var wd = ['周日','周一','周二','周三','周四','周五','周六'][selectedDate.getDay()];

  if (plans.length === 0 && schs.length === 0) {
    document.getElementById('detailDate').textContent = '';
    document.getElementById('detailList').innerHTML = '<div class="empty">这天没有安排</div>';
  } else {
    document.getElementById('detailDate').textContent = m + '月' + dd + '日 ' + wd;
    var items = [];
    schs.forEach(function(s) { items.push('<div class="detail-item"><div>' + s.content + '<br><span class="person-tag">' + (s.person||'') + (s.connector ? ' · ' + s.connector : '') + '</span></div><span class="tag project">项目</span></div>'); });
    plans.forEach(function(p) { items.push('<div class="detail-item"><div>' + p.title + '</div><span class="tag trip">行程</span></div>'); });
    document.getElementById('detailList').innerHTML = items.join('');
  }
  panel.classList.add('show');
}

function selectDate(dk) {
  var parts = dk.split('-');
  selectedDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
  renderCalendar();
  renderDetail();
}

function prevMonth() { currentMonth.setMonth(currentMonth.getMonth() - 1); renderCalendar(); renderDetail(); }
function nextMonth() { currentMonth.setMonth(currentMonth.getMonth() + 1); renderCalendar(); renderDetail(); }

function formatDateKey(d) {
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

function formatTime(d) {
  return ('0' + (d.getMonth() + 1)).slice(-2) + '/' + ('0' + d.getDate()).slice(-2) + ' ' + d.toTimeString().slice(0, 5);
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/kehang-travel/sw.js').catch(function() {});
}
</script>
</body>
</html>
